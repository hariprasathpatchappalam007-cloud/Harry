<section id="dfm-confluence" aria-label="Demand Fund Management">
  <p>Loading Demand Fund Management...</p>
</section>
<script>
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.DfmCore = factory();
})(globalThis, function () {
  'use strict';
  const factors = {technical: .20, regulatory: .20, stakeholder: .15, resource: .15, scale: .15, interdependencies: .10, budget: .05};
  const collections = ['projects', 'pets', 'spendItems', 'budgetSources', 'currencies', 'vendors', 'glFunds', 'budgetLines', 'invoices', 'attachments', 'events'];
  const clone = value => JSON.parse(JSON.stringify(value));
  const assert = (condition, message) => { if (!condition) throw Error(message); };
  const text = (value, limit = 500) => {
    assert(typeof value === 'string' && value.trim().length <= limit, `Text must be a string of at most ${limit} characters.`);
    return value.trim();
  };
  const required = (value, name, limit) => {
    const result = text(value, limit);
    assert(result, `${name} is required.`);
    return result;
  };
  const number = (value, name, positive = false) => {
    assert(typeof value === 'number' && Number.isFinite(value) && (positive ? value > 0 : value >= 0), `${name} must be ${positive ? 'positive' : 'non-negative'} and finite.`);
    assert(value <= 1e12, `${name} exceeds the supported limit.`);
    return value;
  };
  const cents = value => Math.round((value + Number.EPSILON) * 100);
  const amount = (value, name, positive = false) => {
    const rounded = cents(number(value, name, positive)) / 100;
    assert(!positive || rounded >= .01, `${name} must be at least 0.01 after rounding.`);
    return rounded;
  };
  const sum = (rows, field) => rows.reduce((total, row) => total + cents(row[field] || 0), 0) / 100;
  const equal = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
  const item = (state, list, id) => {
    const result = state[list].find(row => row.id === id);
    assert(result, `${list} record not found.`);
    return result;
  };
  const bounded = (value, maximum, name) => { assert(Array.isArray(value) && value.length <= maximum, `${name} must contain at most ${maximum} entries.`); return value; };
  const date = value => {
    if (!value) return '';
    assert(typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && new Date(value + 'T00:00:00Z').toISOString().slice(0, 10) === value, 'Date must be a valid YYYY-MM-DD date.');
    return value;
  };

  function emptyState() {
    return {schemaVersion: 1, revision: 0, roles: {}, projects: [], pets: [], spendItems: [], budgetSources: [],
      currencies: [{id: 'AED', code: 'AED', name: 'UAE Dirham', rate: 1, active: true}], vendors: [], glFunds: [],
      budgetLines: [], invoices: [], attachments: [], events: []};
  }
  function validateState(state) {
    assert(state && state.schemaVersion === 1 && Number.isSafeInteger(state.revision) && state.revision >= 0, 'Unsupported or corrupt DFM ledger.');
    assert(state.roles && typeof state.roles === 'object' && !Array.isArray(state.roles), 'Invalid ledger roles.');
    for (const [username, values] of Object.entries(state.roles)) {
      required(username, 'Username', 150);
      assert(!['__proto__', 'constructor', 'prototype'].includes(username), 'Invalid ledger username.');
      assert(Array.isArray(values) && values.every(role => ['Admin', 'Master', 'Reviewer', 'Approver', 'Requestor'].includes(role)), 'Invalid ledger role assignment.');
    }
    for (const key of collections) {
      bounded(state[key], key === 'events' ? 30000 : 10000, key);
      const ids = new Set();
      for (const row of state[key]) {
        assert(row && typeof row === 'object' && typeof row.id === 'string' && row.id.length > 0 && row.id.length <= 150 && !ids.has(row.id), `Invalid or duplicate ${key} identifier.`);
        ids.add(row.id);
      }
    }
    for (const [list, fields] of Object.entries({budgetSources:['budget'],currencies:['rate'],glFunds:['fundAmount'],pets:['requestedAmount'],spendItems:['units','unitPrice','exchangeRate','foreignAmount','aedAmount','contingencyPercent','finalAedAmount'],budgetLines:['cost'],invoices:['invoiceAmount']}))
      for (const row of state[list]) for (const field of fields) number(row[field], `${list}.${field}`, ['units','unitPrice','exchangeRate','rate'].includes(field));
    for (const [list, property, target] of [['pets','projectId','projects'],['pets','budgetSourceId','budgetSources'],['spendItems','petId','pets'],['budgetLines','petId','pets'],['budgetLines','sourceSpendItemId','spendItems'],['invoices','budgetLineId','budgetLines']])
      for (const row of state[list]) assert(state[target].some(parent => parent.id === row[property]), `Orphaned ${list}.${property} record.`);
    for (const pet of state.pets) {
      assert(['Pending Review','Pending Approval','Approved','Sent Back','Rejected'].includes(pet.status), 'Invalid PET status.');
      assert(cents(pet.requestedAmount) === cents(sum(state.spendItems.filter(row => row.petId === pet.id), 'finalAedAmount')), 'PET amount does not match its spend lines.');
    }
    for (const bl of state.budgetLines) {
      assert(item(state, 'pets', bl.petId).status === 'Approved', 'Budget line belongs to an unapproved PET.');
      assert(item(state, 'spendItems', bl.sourceSpendItemId).petId === bl.petId, 'Budget line references a different PET spend line.');
    }
    finance(state);
    return state;
  }
  function roles(user, state) {
    return Object.entries(state.roles).find(([name]) => equal(name, user.username))?.[1] || ['Requestor'];
  }
  const admin = (user, state) => roles(user, state).some(role => ['Admin', 'Master'].includes(role));
  function canMaintain(user, state) {
    const assigned = roles(user, state);
    return admin(user, state) || !assigned.includes('Approver') || assigned.includes('Reviewer');
  }
  function owner(user, record, state) {
    assert(admin(user, state) || equal(user.username, record.createdBy), 'Only the record owner or a DFM administrator can change this record.');
  }
  function sizing(scores) {
    assert(scores && typeof scores === 'object', 'Complete all seven sizing factors.');
    for (const key of Object.keys(factors)) assert([1, 3, 5].includes(scores[key]), `Choose 1, 3 or 5 for ${key}.`);
    const score = Math.round(Object.entries(factors).reduce((total, [key, weight]) => total + scores[key] * weight, 0) * 100) / 100;
    return {score, size: score <= 1.5 ? 'XS' : score <= 2.3 ? 'S' : score <= 3.5 ? 'M' : score <= 4.1 ? 'L' : 'XL'};
  }
  function line(input, state, makeId, petId, oldRows) {
    const old = input.id ? oldRows.find(row => row.id === input.id) : null;
    assert(!input.id || old, 'Spend line does not belong to this PET.');
    const currency = state.currencies.find(row => row.code === input.currency && row.active);
    assert(currency, 'Choose an active currency.');
    const rate = number(input.exchangeRate ?? currency.rate, 'Exchange rate', true);
    assert(currency.code !== 'AED' || rate === 1, 'AED exchange rate must be 1.');
    const units = number(input.units, 'Units', true);
    const unitPrice = amount(input.unitPrice, 'Unit price', true);
    const contingencyPercent = number(input.contingencyPercent ?? 0, 'Contingency');
    assert(contingencyPercent <= 100, 'Contingency cannot exceed 100%.');
    const foreignAmount = amount(units * unitPrice, 'Foreign amount', true);
    const aedAmount = amount(foreignAmount * rate, 'AED amount', true);
    const finalAedAmount = amount(aedAmount * (1 + contingencyPercent / 100), 'Final AED amount', true);
    const vendor = required(input.vendor, 'Vendor', 200);
    assert(state.vendors.some(row => row.active && equal(row.name, vendor)), 'Choose an active vendor.');
    const recurrence = input.yearlyRecurrence;
    assert(recurrence == null || (Number.isInteger(recurrence) && recurrence >= 1 && recurrence <= 100), 'Yearly recurrence must be 1 to 100 or empty.');
    return {id: old?.id || makeId(), petId, lineId: old?.lineId || makeId(), serialNo: text(input.serialNo || '', 50),
      lineDate: date(input.lineDate), department: required(input.department, 'Department', 150),
      head: required(input.head, 'Head', 150), topic: required(input.topic, 'Topic', 200), vendor,
      description: required(input.description, 'Description', 2000), costType: required(input.costType, 'Cost type', 150),
      unitType: required(input.unitType, 'Unit type', 100), units, unitPrice, currency: currency.code, exchangeRate: rate,
      foreignAmount, aedAmount, contingencyPercent, finalAedAmount, finalAed: finalAedAmount,
      yearlyRecurrence: recurrence ?? null, glNumber: text(input.glNumber || '', 100)};
  }
  function totals(state) {
    return {projects: state.projects.length, pets: state.pets.length, approvedPets: state.pets.filter(row => row.status === 'Approved').length,
      requested: sum(state.pets.filter(row => !['Rejected', 'Cancelled'].includes(row.status)), 'requestedAmount'),
      approved: sum(state.pets.filter(row => row.status === 'Approved'), 'requestedAmount'),
      committed: sum(state.budgetLines, 'cost'), invoiced: sum(state.invoices, 'invoiceAmount'),
      paid: sum(state.invoices.filter(row => ['Paid', 'Settled'].includes(row.invoiceStatus)), 'invoiceAmount'),
      budget: sum(state.budgetSources, 'budget')};
  }
  function budgetUsage(state, id, exceptPet) {
    return sum(state.pets.filter(row => row.budgetSourceId === id && row.id !== exceptPet && !['Rejected', 'Cancelled'].includes(row.status)), 'requestedAmount');
  }
  function finance(state) {
    for (const source of state.budgetSources) assert(cents(budgetUsage(state, source.id)) <= cents(source.budget), `PET requests exceed ${source.description} budget.`);
    for (const pet of state.pets) {
      if (['Rejected', 'Cancelled'].includes(pet.status)) continue;
      assert(cents(sum(state.budgetLines.filter(row => row.petId === pet.id), 'cost')) <= cents(pet.requestedAmount), 'Budget lines exceed the PET amount.');
    }
    for (const spend of state.spendItems) assert(cents(sum(state.budgetLines.filter(row => row.sourceSpendItemId === spend.id), 'cost')) <= cents(spend.finalAedAmount), 'Budget lines exceed the selected spend-line balance.');
    for (const fund of state.glFunds) assert(cents(sum(state.budgetLines.filter(row => row.glNumber === fund.glNumber), 'cost')) <= cents(fund.fundAmount), `Allocation exceeds GL ${fund.glNumber} funding.`);
    for (const bl of state.budgetLines) assert(cents(sum(state.invoices.filter(row => row.budgetLineId === bl.id), 'invoiceAmount')) <= cents(bl.cost), 'Invoices exceed the budget-line balance.');
  }
  function apply(original, action, user, options = {}) {
    validateState(original);
    required(user?.username, 'Signed-in Confluence username', 150);
    assert(action && typeof action.type === 'string' && action.payload && typeof action.payload === 'object', 'An action and payload are required.');
    const state = clone(original);
    const p = action.payload;
    const now = options.now || new Date().toISOString();
    const makeId = options.id || (() => globalThis.crypto.randomUUID());
    const isAdmin = admin(user, state);
    const maintain = () => assert(canMaintain(user, state), 'Approver-only accounts cannot maintain records.');
    const administrative = () => assert(isAdmin, 'DFM administrator role required.');
    const update = (list, data) => {
      const index = state[list].findIndex(row => row.id === data.id);
      if (index < 0) state[list].push(data); else state[list][index] = data;
    };
    let entityId = p.id || p.entityId || '';
    let detail = '';
    switch (action.type) {
      case 'roles.save': {
        administrative();
        const username = required(p.username, 'Confluence username', 150);
        assert(!['__proto__', 'prototype', 'constructor'].includes(username), 'Invalid username.');
        const values = [...new Set(bounded(p.roles, 5, 'Roles'))];
        assert(values.every(role => ['Admin', 'Master', 'Reviewer', 'Approver', 'Requestor'].includes(role)), 'Unsupported role.');
        const previous = Object.keys(state.roles).find(name => equal(name, username));
        if (previous) delete state.roles[previous];
        Object.defineProperty(state.roles, username, {value: values.length ? values : ['Requestor'], enumerable: true, writable: true, configurable: true});
        assert(Object.values(state.roles).some(value => value.includes('Admin') || value.includes('Master')), 'At least one DFM administrator must remain.');
        entityId = username;
        break;
      }
      case 'budget.save': {
        administrative();
        const old = p.id ? item(state, 'budgetSources', p.id) : null;
        assert(['CAPEX', 'OPEX'].includes(p.budgetType), 'Choose CAPEX or OPEX.');
        const externalId = required(p.externalId, 'Budget source reference', 100);
        assert(!state.budgetSources.some(row => row.id !== old?.id && equal(row.externalId, externalId)), 'Budget source reference already exists.');
        const row = {id: old?.id || makeId(), externalId, budgetType: p.budgetType, description: required(p.description, 'Budget description', 500), budget: amount(p.budget, 'Budget'), active: p.active !== false};
        update('budgetSources', row); entityId = row.id;
        break;
      }
      case 'currency.save': {
        administrative();
        const code = required(p.code, 'Currency code', 3).toUpperCase();
        assert(/^[A-Z]{3}$/.test(code), 'Currency code must have three letters.');
        const old = p.id ? item(state, 'currencies', p.id) : state.currencies.find(row => row.code === code);
        assert(!old || old.code === code, 'Currency code cannot be changed.');
        const rate = number(p.rate ?? p.rateToLocal, 'Conversion rate', true);
        assert(code !== 'AED' || (rate === 1 && p.active !== false), 'AED must remain active at rate 1.');
        const row = {id: old?.id || makeId(), code, name: required(p.name, 'Currency name', 100), rate, active: p.active !== false};
        update('currencies', row); entityId = row.id;
        break;
      }
      case 'vendor.save': {
        administrative();
        const name = required(p.name, 'Vendor name', 200);
        const old = p.id ? item(state, 'vendors', p.id) : null;
        assert(!state.vendors.some(row => row.id !== old?.id && equal(row.name.trim(), name)), 'Vendor already exists.');
        assert(!old || old.name === name || !state.spendItems.some(row => equal(row.vendor, old.name)), 'An in-use vendor cannot be renamed; deactivate it instead.');
        const row = {id: old?.id || makeId(), name, active: p.active !== false};
        update('vendors', row); entityId = row.id;
        break;
      }
      case 'gl.save': {
        administrative();
        const glNumber = required(p.glNumber, 'GL number', 100);
        const old = p.id ? item(state, 'glFunds', p.id) : null;
        assert(!old || old.glNumber === glNumber, 'GL number cannot be changed.');
        assert(!state.glFunds.some(row => row.id !== old?.id && equal(row.glNumber, glNumber)), 'GL number already exists.');
        const row = {id: old?.id || makeId(), glNumber, glName: required(p.glName, 'GL name', 200), fundAmount: amount(p.fundAmount, 'Fund amount'), active: p.active !== false};
        update('glFunds', row); entityId = row.id;
        break;
      }
      case 'project.save': {
        maintain();
        const old = p.id ? item(state, 'projects', p.id) : null;
        if (old) owner(user, old, state);

      case 'restart': S.root.removeAttribute('data-dfm-booted'); return boot({root:S.root,config:S.config});
      case 'create-ledger':
        S.saving = true; applyBusy();
        try { S.state = await S.client.create(); S.page = S.client.page; S.phase = 'ready'; render(); }
        finally { S.saving = false; applyBusy(); }
        return;
      case 'project': S.projectId = id; S.view = 'project'; render(); return;
      case 'new-project': return openDialog('project',{isJira:false,projectType:'Project',sizingScores:{}});
      case 'edit-project': return openDialog('project',byId(list('projects'),id));
      case 'new-pet': return openDialog('pet',{projectId:id});
      case 'edit-pet': return openDialog('pet',byId(list('pets'),id));
      case 'decision': return openDialog('decision',byId(list('pets'),id));
      case 'new-bl': return openDialog('budgetLine',{petId:id,camStatus:CAM_STATUSES[0]});
      case 'edit-bl': return openDialog('budgetLine',byId(list('budgetLines'),id));
      case 'new-invoice': return openDialog('invoice',{budgetLineId:id,invoiceStatus:'Unpaid'});
      case 'edit-invoice': return openDialog('invoice',byId(list('invoices'),id));
      case 'new-master': return openDialog(id,{active:true,rate:1,budgetType:'CAPEX',roles:[]});
      case 'edit-master':
        var collection = {budget:'budgetSources',currency:'currencies',vendor:'vendors',gl:'glFunds'};
        return openDialog(arg,arg==='roles'?{username:id,roles:st().roles[id]}:byId(list(collection[arg]),id));
      case 'close-dialog': return closeDialog();
      case 'delete-pet': case 'delete-bl': case 'delete-invoice':
        if (!global.confirm('Remove this record? Confluence page history retains previous versions.')) return;
        return commit({type: {'delete-pet':'pet.delete','delete-bl':'budgetLine.delete','delete-invoice':'invoice.delete'}[action],payload:{id:id}});
      case 'add-row':
        if (S.dialog.rows.length >= 500) throw Error('A PET supports at most 500 lines.');
        S.dialog.rows.push(blankSpendRow(S.dialog.rows.length));
        region('dialog').querySelector('[data-region="spend-grid"]').innerHTML = renderSpendGrid(); return;
      case 'remove-row':
        S.dialog.rows.splice(Number(id),1);
        region('dialog').querySelector('[data-region="spend-grid"]').innerHTML = renderSpendGrid(); return;
      case 'download-template':
        return download('DFM-PET-template.csv',toCsv(SPEND_COLUMNS,[]));
      case 'upload':
        S.pendingUpload = {entityType:arg,entityId:id};
        region('upload').accept = DOC_ACCEPT; region('upload').value = ''; region('upload').click(); return;
      case 'remove-attachment':
        row = byId(list('attachments'),id);
        if (!global.confirm('Remove this ledger link? The original file stays in Confluence attachments and must be managed there.')) return;
        return commit({type:'attachment.remove',payload:{id:id,entityType:row.entityType,entityId:row.entityId}});
      case 'load-jira':
        S.jira.loading = true; S.jira.error = ''; render();
        try { S.jira.issues = await S.client.searchJira(); }
        catch (error) { S.jira.error = errText(error); }
        finally { S.jira.loading = false; render(); }
        return;
      case 'register-jira':
        row = jiraIssueView(arr(S.jira.issues).find(function (issue) { return issue.key === id; }));
        return openDialog('project',{isJira:true,jiraKey:row.key,projectName:row.summary,projectType:PROJECT_TYPES.includes(row.type)?row.type:'Project',projectManager:row.assignee,sizingScores:{}});
      case 'export-ledger': return download('DFM-ledger-rev-'+st().revision+'.json',JSON.stringify(st(),null,2),'application/json');
      case 'export-report':
        return download('DFM-project-report.csv',toCsv([{label:'Project',get:function (r) { return projectLabel(r.project); }},{key:'status',label:'Status'},{key:'approved',label:'Approved AED'},
          {key:'pending',label:'Reserved AED'},{key:'committed',label:'Committed AED'},{key:'invoiced',label:'Invoiced AED'},{key:'paid',label:'Paid AED'}],computeReport(st()).projects));
      default: throw Error('Unknown workspace action.');
    }
  }
  async function submit(form) {
    if (S.saving || S.validating) throw Error('Wait for the current save.');
    if (!S.dialog) return;
    S.validating = true; applyBusy();
    try {
    var kind = S.dialog.kind, payload = readForm(form);
    if (kind === 'roles') { var user = await S.client.findUser(payload.username); payload.username = user.username; S.users[user.username.toLowerCase()] = user; }
    if (kind === 'project') for (var key of ['accountableExecLead','accountableExec']) {
      var member = await S.client.findUser(payload[key]); payload[key] = member.username; S.users[member.username.toLowerCase()] = member;
    }
    var type = kind === 'decision' ? 'pet.decision' : kind + '.save';
    return await commit({type:type,payload:payload});
    } finally { S.validating = false; applyBusy(); }
  }
  async function importFile(file) {
    if (!file) return;
    if (!/\.(csv|tsv|txt)$/i.test(file.name) || file.size > 1024*1024) throw Error('Import a CSV/TSV file up to 1 MiB. Save Excel workbooks as CSV first.');
    var text = await file.text(), table = parseDelimited(text);
    if (table.length > 501) throw Error('A CSV import supports at most 500 lines.');
    var result = mapImportRows(table,st(),0);
    if (!result.rows.length) throw Error(result.warnings.join(' ') || 'No spend lines found.');
    S.dialog.rows = result.rows;
    region('dialog').querySelector('[data-region="spend-grid"]').innerHTML = renderSpendGrid();
    region('dialog').querySelector('[data-region="import-message"]').textContent = 'Preview loaded. Review every row before saving. ' + result.warnings.join(' ');
  }
  function bindEvents() {
    if (S.root.dataset.dfmBound) return;
    S.root.dataset.dfmBound = '1';
    S.root.addEventListener('click',function (event) {
      var button = event.target.closest('[data-action]');
      if (button && S.root.contains(button)) {
        event.preventDefault();
        handleAction(button).catch(showError);
      }
    });
    S.root.addEventListener('submit',function (event) {
      if (event.target.matches('[data-dfm-form]')) { event.preventDefault(); submit(event.target).catch(showError); }
    });
    S.root.addEventListener('input',function (event) {
      var input = event.target;
      if (input.dataset.filter) { S.filters[input.dataset.filter] = input.value; render(); }
      if (input.name?.startsWith('score.')) updateSizing();
      if (input.dataset.row !== undefined && S.dialog) {
        var index = Number(input.dataset.row), row = S.dialog.rows[index];
        row[input.dataset.key] = input.value;
        if (input.dataset.key === 'currency') row.exchangeRate = currencyRate(st(),input.value);
        calcSpendRow(row,st());
        region('dialog').querySelectorAll('[data-calc][data-index="'+index+'"]').forEach(function (cell) { cell.textContent = row[cell.dataset.calc] || 'Assigned on save'; });
        region('dialog').querySelector('[data-region="spend-total"]').textContent = fmt(S.dialog.rows.reduce(function (total,r) { return total+num(r.finalAed); },0));
      }
    });
    S.root.addEventListener('change',function (event) {
      var input = event.target;
      if (input.matches('[data-import]')) importFile(input.files[0]).catch(showError);
      if (input === region('upload') && input.files[0]) {
        S.saving = true; applyBusy();
        S.client.upload(S.pendingUpload.entityType,S.pendingUpload.entityId,input.files[0]).then(function (state) {
          S.state = state; S.page = S.client.page; S.banner = null; render();
        }).catch(showError).finally(function () { S.saving = false; applyBusy(); });
      }
      if (input.name === 'sourceSpendItemId') {
        var row = byId(list('spendItems'),input.value);
        if (row) {
          var form = input.form;
          form.elements.namedItem('vendor').value = row.vendor;
          form.elements.namedItem('glNumber').value = row.glNumber;
        }
      }
    });
    S.root.addEventListener('cancel',function (event) {
      if (!event.target.matches('.dfm-dialog')) return;
      if (S.saving || S.validating) event.preventDefault(); else S.dialog = null;
    },true);
  }
  return {autoBoot:autoBoot,boot:boot,parseDelimited:parseDelimited,mapImportRows:mapImportRows,
    calcSpendRow:calcSpendRow,computeReport:computeReport,toCsv:toCsv,esc:esc,
    sizingTotal:sizingTotal,sizeFromScore:sizeFromScore,configProblems:configProblems};
});

</script>
